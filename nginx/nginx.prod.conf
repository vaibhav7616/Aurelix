# Aurelix — production edge proxy (TLS). Server blocks live in templates/aurelix.conf.template,
# rendered by the nginx image at start-up with ${DOMAIN} from the environment.
worker_processes auto;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;

  upstream aurelix_frontend { server frontend:5173; }
  upstream aurelix_backend { server backend:4000; }

  include /etc/nginx/conf.d/*.conf;
}
