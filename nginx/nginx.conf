# Aurelix — edge proxy: / -> frontend, /api/ -> backend, /socket.io/ -> websocket
worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;

  # Security headers
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  upstream aurelix_frontend { server frontend:5173; }
  upstream aurelix_backend { server backend:4000; }

  server {
    listen 80;
    server_name _;
    client_max_body_size 2m;

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    # Backend REST
    location /api/ {
      proxy_pass http://aurelix_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 30s;
      proxy_connect_timeout 5s;
    }
    # Health directly
    location = /health { proxy_pass http://aurelix_backend/health; }
    location = /ready { proxy_pass http://aurelix_backend/ready; }

    # WebSockets (Socket.IO)
    location /socket.io/ {
      proxy_pass http://aurelix_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # Frontend SPA
    location / {
      proxy_pass http://aurelix_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
