name: aurelix
services:
  postgres:
    image: postgres:16-alpine
    container_name: aurelix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aurelix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurelix_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aurelix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aurelix} -d ${POSTGRES_DB:-aurelix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aurelix-net]

  redis:
    image: redis:7-alpine
    container_name: aurelix-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [aurelix-net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: aurelix-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://aurelix:aurelix_dev_secret@postgres:5432/aurelix?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-dev-access-secret-change-me-please-32chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-please-32chars}
      API_PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost,http://127.0.0.1:5173,http://127.0.0.1,http://localhost:80,http://127.0.0.1:80}
      MARKET_PROVIDER: ${MARKET_PROVIDER:-demo}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-demo}
      DEMO_STARTING_BALANCE: ${DEMO_STARTING_BALANCE:-10000}
    ports:
      - "4000:4000"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    command: sh -c "node scripts/db-migrate.cjs && npx prisma db seed && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [aurelix-net]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: aurelix-frontend
    restart: unless-stopped
    environment:
      VITE_DEV_PROXY: ${VITE_DEV_PROXY:-http://backend:4000}
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_WS_URL: ${VITE_WS_URL:-}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    command: npm run dev -- --host 0.0.0.0 --port 5173
    networks: [aurelix-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: aurelix-nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [aurelix-net]

volumes:
  pgdata:
  redisdata:

networks:
  aurelix-net:
    driver: bridge
